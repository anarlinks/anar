<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анар Абдуллаев</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%); /* Розовый градиент */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            padding: 40px 20px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #4a4a4a;
        }

        .username {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-decoration: none;
            color: #333;
            display: block;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-weight: 600;
            font-size: 18px;
        }

        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            background: #fff;
        }

        .footer-text {
            margin-top: 40px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Твое изображение -->
        <img src="https://i.ibb.co/FktrYXr6/photo.jpg" alt="Анар Абдуллаев" class="profile-img">

        <h1>Анар Абдуллаев</h1>
        <div class="username">@anartgbot</div>

        <!-- Твоя обновленная ссылка -->
        <a href="https://t.me/anartgbot?start=019defd9-bc94-7685-82e9-9b9b3b59a201" class="link-card">
            ЗАБРАТЬ БОНУСЫ ОТ АНАРА 🚀
        </a>

        <!-- Дополнительная кнопка для веса (можно дублировать или вести на канал) -->
        <a href="https://t.me/anartgbot?start=019defd9-bc94-7685-82e9-9b9b3b59a201" class="link-card">
            ПОЛУЧИТЬ ПРИЗ 🎁
        </a>

        <div class="footer-text">
            © 2026 Официальное сообщество
        </div>
    </div>

</body>
</html>
