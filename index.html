<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анар Абдуллаев | Официальные ссылки</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0e1621; /* Темный фон как в ТГ */
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
        }

        /* Блок 1: Основная кнопка */
        .main-btn {
            background: #2481cc;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            display: block;
            margin-bottom: 15px;
            border: 1px solid #303d4d;
            font-size: 16px;
        }

        /* Блок 2: Копирование юзернейма */
        .info-card {
            background: #17212b;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #303d4d;
            margin-bottom: 20px;
        }

        .warning-text {
            color: #f6d365;
            font-size: 14px;
            margin-bottom: 15px;
            display: block;
            line-height: 1.4;
        }

        .copy-box {
            background: #0e1621;
            border-radius: 30px;
            padding: 5px 5px 5px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #303d4d;
        }

        .copy-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        /* Блок 3: VPN блок */
        .vpn-card {
            background: #17212b;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #303d4d;
        }

        .vpn-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .vpn-logo {
            width: 45px;
            height: 45px;
            margin-right: 15px;
        }

        .vpn-title { font-weight: bold; font-size: 18px; }
        .vpn-subtitle { color: #808b99; font-size: 13px; }

        .tags {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tag {
            background: #0e1621;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            color: #808b99;
        }

        .download-btn {
            background: #2b5278;
            color: white;
            text-decoration: none;
            display: block;
            text-align: center;
            padding: 12px;
            border-radius: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-section">
            <img src="https://i.ibb.co/FktrYXr6/photo.jpg" alt="Анар Абдуллаев" class="profile-img">
            <h2>Анар Абдуллаев</h2>
        </div>

        <!-- Блок 1 -->
        <a href="https://t.me/anartgbot?start=019defd9-bc94-7685-82e9-9b9b3b59a201" class="main-btn">
            📢 ПЕРЕЙТИ В TELEGRAM-КАНАЛ
        </a>

        <!-- Блок 2 -->
        <div class="info-card">
            <span class="warning-text">
                ⚠️ Если Telegram не открывается — подключи Amnezia VPN и найди канал вручную:
            </span>
            <div class="copy-box">
                <span>@anartgbot</span>
                <button class="copy-btn" onclick="copyText()">📋 КОПИРОВАТЬ</button>
            </div>
        </div>

        <!-- Блок 3 -->
        <div class="vpn-card">
            <div class="vpn-header">
                <img src="https://amnezia.org/favicon.ico" class="vpn-logo" alt="logo">
                <div>
                    <div class="vpn-title">Amnezia VPN</div>
                    <div class="vpn-subtitle">Работает там, где другие молчат</div>
                </div>
            </div>
            <div class="tags">
                <span class="tag">🚀 Обход блокировок</span>
                <span class="tag">🔒 Open Source</span>
                <span class="tag">📱 Все устройства</span>
            </div>
            <a href="https://amnezia.org/" class="download-btn" target="_blank">🔒 СКАЧАТЬ Amnezia VPN</a>
        </div>
    </div>

    <script>
        function copyText() {
            navigator.clipboard.writeText("@anartgbot");
            alert("Юзернейм скопирован!");
        }
    </script>

</body>
</html>
