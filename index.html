<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анар Абдуллаев | Официальные ссылки</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0e1621;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
        }

        /* Общий стиль для блоков с рамкой как в оригинале */
        .content-block {
            background: #17212b;
            border-radius: 28px; /* Глубокое скругление */
            padding: 24px;
            border: 1px solid #303d4d; /* Та самая обводка */
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .main-btn {
            background: transparent;
            border-radius: 40px;
            padding: 18px;
            text-align: center;
            text-decoration: none;
            color: #4ea4f5; /* Цвет текста кнопки */
            font-weight: bold;
            display: block;
            border: 2px solid #2b5278; /* Обводка самой кнопки */
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .warning-text {
            color: #f6d365;
            font-size: 14px;
            margin-bottom: 15px;
            display: block;
            line-height: 1.4;
            text-align: center;
        }

        .copy-box {
            background: #0e1621;
            border-radius: 35px;
            padding: 6px 6px 6px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #303d4d;
        }

        .copy-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            text-transform: uppercase;
        }

        .vpn-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .vpn-logo {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            border-radius: 12px;
        }

        .vpn-title { font-weight: bold; font-size: 19px; }
        .vpn-subtitle { color: #808b99; font-size: 13px; }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tag {
            background: #0e1621;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: #ffffff;
            border: 1px solid #303d4d;
        }

        .download-btn {
            background: #2b5278;
            color: white;
            text-decoration: none;
            display: block;
            text-align: center;
            padding: 16px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-section">
            <img src="https://i.ibb.co/FktrYXr6/photo.jpg" alt="Анар Абдуллаев" class="profile-img">
            <h2>Анар Абдуллаев</h2>
        </div>

        <!-- Первый блок с кнопкой перехода -->
        <div class="content-block">
            <a href="https://t.me/anartgbot?start=019defd9-bc94-7685-82e9-9b9b3b59a201" class="main-btn">
                🔊 ПЕРЕЙТИ В TELEGRAM-КАНАЛ
            </a>
        </div>

        <!-- Второй блок с копированием -->
        <div class="content-block">
            <span class="warning-text">
                ⚠️ Если Telegram не открывается — подключи Amnezia VPN и найди канал вручную:
            </span>
            <div class="copy-box">
                <span>@anartgbot</span>
                <button class="copy-btn" onclick="copyText()">📋 КОПИРОВАТЬ</button>
            </div>
        </div>

        <!-- Третий блок с VPN -->
        <div class="content-block">
            <div class="vpn-header">
                <img src="https://amnezia.org/favicon.ico" class="vpn-logo" alt="logo">
                <div>
                    <div class="vpn-title">Amnezia VPN</div>
                    <div class="vpn-subtitle">Работает там, где другие молчат</div>
                </div>
            </div>
            <div class="tags">
                <span class="tag">🚀 Обход блокировок</span>
                <span class="tag">🔒 Open Source</span>
                <span class="tag">📱 Все устройства</span>
            </div>
            <a href="https://amnezia.org/" class="download-btn" target="_blank">🔒 СКАЧАТЬ Amnezia VPN</a>
        </div>
    </div>

    <script>
        function copyText() {
            navigator.clipboard.writeText("@anartgbot");
            alert("Юзернейм скопирован!");
        }
    </script>

</body>
</html>
