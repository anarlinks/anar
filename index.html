<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анар Абдуллаев | Официальные ссылки</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0e1621;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center; /* Центрирование всей карточки на экране */
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        /* Единый общий блок с обводкой */
        .main-card {
            background: #17212b;
            border-radius: 28px;
            padding: 30px 24px;
            border: 1px solid #303d4d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 10px; /* Уменьшил отступ снизу */
            object-fit: cover;
            border: 3px solid #2481cc; /* Голубая обводка в цвете ТГ */
            padding: 2px;
        }

        h2 {
            margin: 0 0 25px 0; /* Поднял выше и отцентрировал */
            font-size: 22px;
            font-weight: bold;
        }

        /* Элементы внутри блока */
        .main-btn {
            background: transparent;
            border-radius: 40px;
            padding: 16px;
            text-align: center;
            text-decoration: none;
            color: #4ea4f5;
            font-weight: bold;
            display: block;
            border: 2px solid #2b5278;
            font-size: 15px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .warning-text {
            color: #f6d365;
            font-size: 13px;
            margin-bottom: 12px;
            display: block;
            line-height: 1.4;
        }

        .copy-box {
            background: #0e1621;
            border-radius: 35px;
            padding: 5px 5px 5px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #303d4d;
            margin-bottom: 25px;
        }

        .copy-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        .vpn-section {
            border-top: 1px solid #303d4d; /* Разделительная линия внутри блока */
            padding-top: 20px;
            text-align: left;
        }

        .vpn-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .vpn-logo {
            width: 45px;
            height: 45px;
            margin-right: 12px;
            border-radius: 10px;
        }

        .vpn-title { font-weight: bold; font-size: 17px; }
        .vpn-subtitle { color: #808b99; font-size: 12px; }

        .tags {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tag {
            background: #0e1621;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 11px;
            color: #ffffff;
            border: 1px solid #303d4d;
        }

        .download-btn {
            background: #2b5278;
            color: white;
            text-decoration: none;
            display: block;
            text-align: center;
            padding: 14px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            <!-- Аватар с голубой обводкой -->
            <img src="https://i.ibb.co/FktrYXr6/photo.jpg" alt="Анар Абдуллаев" class="profile-img">
            
            <!-- Центрированное имя -->
            <h2>Анар Абдуллаев</h2>

            <!-- Кнопка перехода -->
            <a href="https://t.me/anartgbot?start=019defd9-bc94-7685-82e9-9b9b3b59a201" class="main-btn">
                📢 ПЕРЕЙТИ В TELEGRAM-КАНАЛ
            </a>

            <!-- Блок копирования -->
            <span class="warning-text">
                ⚠️ Если Telegram не открывается — подключи Amnezia VPN и найди канал вручную:
            </span>
            <div class="copy-box">
                <span>@anartgbot</span>
                <button class="copy-btn" onclick="copyText()">📋 КОПИРОВАТЬ</button>
            </div>

            <!-- VPN секция (теперь часть одной карты) -->
            <div class="vpn-section">
                <div class="vpn-header">
                    <img src="https://amnezia.org/favicon.ico" class="vpn-logo" alt="logo">
                    <div>
                        <div class="vpn-title">Amnezia VPN</div>
                        <div class="vpn-subtitle">Работает там, где другие молчат</div>
                    </div>
                </div>
                <div class="tags">
                    <span class="tag">🚀 Обход</span>
                    <span class="tag">🔒 Open Source</span>
                    <span class="tag">📱 Все устройства</span>
                </div>
                <a href="https://amnezia.org/" class="download-btn" target="_blank">🔒 СКАЧАТЬ VPN</a>
            </div>
        </div>
    </div>

    <script>
        function copyText() {
            navigator.clipboard.writeText("@anartgbot");
            alert("Юзернейм скопирован!");
        }
    </script>

</body>
</html>
